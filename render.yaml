# Render Blueprint: New > Blueprint > pick this repo. Or create a Web Service manually with the same settings.
services:
  - type: web
    name: crewai-agents
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GEMINI_API_KEY
        sync: false          # you paste the key in the Render dashboard; it is never stored in git
      - key: MALLOC_ARENA_MAX
        value: "2"           # keeps memory under the free plan's 512 MB
      - key: CORS_ORIGINS
        value: "*"
